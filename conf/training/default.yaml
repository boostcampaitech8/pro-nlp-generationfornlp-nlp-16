num_epochs: 3
learning_rate: 2e-5
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
weight_decay: 0.01
logging_steps: 10
save_strategy: "epoch"
evaluation_strategy: "epoch"
save_total_limit: 2
lr_scheduler_type: "cosine"

load_best_model_at_end: true
metric_for_best_model: "f1"
greater_is_better: true