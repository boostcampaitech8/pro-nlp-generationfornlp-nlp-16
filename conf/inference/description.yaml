# Description Generation Inference Configuration
# This config is for generating helpful descriptions (hints) for test samples

# Checkpoint path (leave empty to auto-detect latest DAPT model)
checkpoint_dir: ""
checkpoint_step: "best"  # "best" or specific step number

# Output files
description_output_csv: "descriptions.csv"
description_output_json: "descriptions.json"

# Model dtype
torch_dtype: "float16"  # SKT A.X 모델은 bfloat16 권장

# Generation parameters
generation:
  max_new_tokens: 250          # Description length (reduced from 400 to prevent verbosity)
  do_sample: true              # Use sampling for diversity
  temperatures: [0.3, 0.7]     # Lower temperatures for more focused output (was [0.5, 0.9])
  top_p: 0.85                  # Nucleus sampling (reduced from 0.9)
  top_k: 40                    # Top-k sampling (reduced from 50 for more restrictive selection)
  repetition_penalty: 1.3      # Stronger penalty against repetition (increased from 1.1)