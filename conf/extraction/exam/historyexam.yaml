# conf/extraction/exam/historyexam.yaml

name: "historyexam"
display_name: "한국사능력검정시험"

# 문제 수 범위 (검증용)
question_range:
  min: 1
  max: 50

# 선택지 수
choices_count: 5

# 문제 추출 프롬프트
question_prompt: |
  이 한국사능력검정시험 이미지에서 문제를 추출해주세요.

  ⚠️ 중요: 모든 텍스트는 이미지에 보이는 그대로 정확히 추출하세요.
  - 오타 수정 금지
  - 내용 요약 금지  
  - 임의로 단어 변경 금지
  - 띄어쓰기, 맞춤법 원본 그대로 유지

  각 문제를 아래 JSON 형식으로 추출:
  {
    "questions": [
      {
        "id": "문제번호 (숫자만)",
        "paragraph": "메인 지문 (아래 규칙 참고)",
        "question": "질문 내용 (원문 그대로)",
        "choices": ["선택지1", "선택지2", "선택지3", "선택지4", "선택지5"],
        "image_description": "paragraph에 포함되지 않은 보조 시각자료 설명 (아래 규칙 참고)"
      }
    ]
  }

  📌 paragraph vs image_description 구분 규칙:

  【paragraph에 넣을 것】 (우선적으로 채우기)
  - 문제 상단의 텍스트 지문, 대화문, 사료, 인용문
  - 지도/도표/연표/그림 안에 있는 핵심 텍스트 정보
  - "다음 자료를 보고", "밑줄 친 '이 사건'" 등에서 참조하는 주요 내용
  - 이미지 속 말풍선, 설명문, 제목, 범례 등 텍스트

  【image_description에 넣을 것】 (보조 정보만)
  - paragraph만으로 문제를 풀기 어려운 경우, 시각적 요소 보충 설명
  - 예: 지도의 위치 표시, 인물 사진의 특징, 도표의 구조 등
  - paragraph가 충분하면 빈 문자열로 둘 것

  💡 핵심 원칙:
  1. paragraph를 먼저, 최대한 채운다
  2. image_description은 paragraph를 보완하는 역할만 한다

  주의사항:
  1. 선택지는 ①②③④⑤ 기호 제외하고 원문 그대로 추출
  2. 고유명사, 연도, 인물명 등은 절대 변경하지 말 것
  3. "~했다", "~이다" 등 어미도 원본 그대로
  4. 문제가 없는 페이지면 빈 배열 반환: {"questions": []}
  5. JSON만 출력

# 정답 추출 프롬프트
answer_prompt: |
  이 한국사능력검정시험 정답표에서 문제번호와 정답을 추출해주세요.

  📌 정답표 구조:
  - 5개 열로 구성: (1-10번), (11-20번), (21-30번), (31-40번), (41-50번)
  - 각 열은 "문항번호 | 정답 | 배점" 형식
  - 정답은 ①②③④⑤ 형태로 표시됨

  📌 변환 규칙:
  - ① → 1
  - ② → 2
  - ③ → 3
  - ④ → 4
  - ⑤ → 5

  📌 추출 방법:
  1. 1번부터 50번까지 순서대로 추출
  2. 각 문항의 정답 기호(①~⑤)를 숫자(1~5)로 변환
  3. 배점은 무시

  JSON 형식으로 출력:
  {
    "answers": {
      "1": 5,
      "2": 2,
      "3": 3,
      ...
      "50": 5
    }
  }

  - 문제번호는 문자열 ("1", "2", ...)
  - 정답은 숫자 (1, 2, 3, 4, 5)
  - 반드시 1번부터 50번까지 모두 포함
  - JSON만 출력, 다른 텍스트 없이