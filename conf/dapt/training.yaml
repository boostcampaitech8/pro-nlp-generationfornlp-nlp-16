# DAPT Training Configuration
# DAPT (Domain-Adaptive Pre-Training) uses language modeling to adapt to domain

num_epochs: 2  # DAPT usually needs fewer epochs than SFT
learning_rate: 5e-5  # Slightly higher LR for DAPT
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
weight_decay: 0.01
logging_steps: 50
save_strategy: "epoch"
evaluation_strategy: "epoch"
save_total_limit: 2
lr_scheduler_type: "cosine"

load_best_model_at_end: true
metric_for_best_model: "loss"  # For DAPT, we use loss (lower is better)
greater_is_better: false  # Lower loss is better

fp16: true
gradient_accumulation_steps: 16  # Increased to reduce memory per step
gradient_checkpointing: true
